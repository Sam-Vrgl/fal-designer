<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Canvas testing</title>
  <style>
    body { margin:0; }
    #controls{
      /* position:fixed; top:8px; left:8px; z-index:10; */
      background:#fff; border:1px solid #ccc; border-radius:8px;
      padding:8px 10px; font:14px/1.3 system-ui, sans-serif;
      box-shadow:0 2px 6px rgba(0,0,0,.08);
    }
    #controls label{ display:flex; gap:.5rem; align-items:center; white-space:nowrap; }
    #controls .row{ display:flex; gap:12px; }
  </style>
</head>

<body>
  <!-- controls -->
  <div id="controls">
    <div class="row">
      <label><input id="toggleV" type="checkbox" checked /> Mid vertical helper</label>
      <label><input id="toggleH" type="checkbox" checked /> Mid horizontal helper</label>
    </div>
  </div>

  <canvas id="myCanvas" style="display:block; margin:0 auto; border:1px solid #000"></canvas>

  <script>
    const canvas = document.getElementById('myCanvas');
    const ctx = canvas.getContext('2d');

    // checkbox elements
    const chkV = document.getElementById('toggleV');
    const chkH = document.getElementById('toggleH');

    // --- Constants in millimeters ---
    const mmToPx   = 3.7795275591; // CSS px at 96dpi
    const GRID_W_MM = 700;         // grid width
    const GRID_H_MM = 120;         // grid height
    const MARGIN_MM = 10;          // inner margin around the grid

    // Total drawing area (grid + inner margins)
    const TOTAL_W_MM = GRID_W_MM + 2 * MARGIN_MM;
    const TOTAL_H_MM = GRID_H_MM + 2 * MARGIN_MM;

    function draw() {
      // Fit canvas in viewport while preserving aspect ratio of TOTAL_W:TOTAL_H
      const dpr = window.devicePixelRatio || 1;

      // How big (in CSS px) the total area would be at 1:1 (mm->px) scale
      const totalCssW = TOTAL_W_MM * mmToPx;
      const totalCssH = TOTAL_H_MM * mmToPx;

      // Scale to fit inside viewport
      const scaleCss = Math.min(
        window.innerWidth / totalCssW,
        window.innerHeight / totalCssH
      );

      // Canvas CSS size
      const cssW = totalCssW * scaleCss;
      const cssH = totalCssH * scaleCss;

      // Apply CSS size
      canvas.style.width  = cssW + 'px';
      canvas.style.height = cssH + 'px';

      // Backing store size in device pixels
      canvas.width  = Math.round(cssW * dpr);
      canvas.height = Math.round(cssH * dpr);

      // Transform so drawing uses "unscaled" totalCssW/H coordinates
      ctx.setTransform(dpr * scaleCss, 0, 0, dpr * scaleCss, 0, 0);

      // Clear
      ctx.clearRect(0, 0, totalCssW, totalCssH);

      // Outer border (total area including margins)
      ctx.strokeStyle = '#000';
      ctx.lineWidth = 1;
      ctx.strokeRect(0, 0, totalCssW, totalCssH);

      // Grid bounds inside inner margin
      const left   = MARGIN_MM * mmToPx;
      const top    = MARGIN_MM * mmToPx;
      const right  = (MARGIN_MM + GRID_W_MM) * mmToPx;
      const bottom = (MARGIN_MM + GRID_H_MM) * mmToPx;

      // Margin rectangle
      ctx.strokeStyle = '#a0a0a0';
      ctx.lineWidth = 1;
      ctx.strokeRect(left, top, right - left, bottom - top);

      // 1 mm grid (light)
      ctx.beginPath();
      for (let xMm = 0; xMm <= GRID_W_MM; xMm++) {
        const x = left + xMm * mmToPx;
        ctx.moveTo(x, top); ctx.lineTo(x, bottom);
      }
      for (let yMm = 0; yMm <= GRID_H_MM; yMm++) {
        const y = top + yMm * mmToPx;
        ctx.moveTo(left, y); ctx.lineTo(right, y);
      }
      ctx.strokeStyle = 'lightgray';
      ctx.lineWidth = 1;
      ctx.stroke();

      // 10 mm accents (darker)
      ctx.beginPath();
      for (let x10 = 0; x10 <= GRID_W_MM; x10 += 10) {
        const x = left + x10 * mmToPx;
        ctx.moveTo(x, top); ctx.lineTo(x, bottom);
      }
      for (let y10 = 0; y10 <= GRID_H_MM; y10 += 10) {
        const y = top + y10 * mmToPx;
        ctx.moveTo(left, y); ctx.lineTo(right, y);
      }
      ctx.strokeStyle = '#c0c0c0';
      ctx.lineWidth = 1.25;
      ctx.stroke();

      // Demo fills
      colorRectGridMM(0, 0, 700, 60, 'rgba(0,0,255)');
      colorRectGridMM(0, 60, 700, 120, 'rgba(0,0,0)');

      // --- Helper lines (including margins) ---
      const midX = totalCssW / 2;
      const midY = totalCssH / 2;

      ctx.save();
      ctx.strokeStyle = '#666';
      ctx.lineWidth = 3;

      if (chkV.checked) {
        ctx.beginPath();
        ctx.moveTo(midX, 0); ctx.lineTo(midX, totalCssH);
        ctx.stroke();
      }
      if (chkH.checked) {
        ctx.beginPath();
        ctx.moveTo(0, midY); ctx.lineTo(totalCssW, midY);
        ctx.stroke();
      }
      ctx.restore();
    }

    // Toggle events -> redraw
    chkV.addEventListener('change', draw);
    chkH.addEventListener('change', draw);

    // Initial draw + redraw on resize
    window.addEventListener('resize', draw);
    draw();

    // --- helpers ---
    function colorRectGridMM(x1_mm, y1_mm, x2_mm, y2_mm, color, opts = {}) {
      const { behind = false, clamp = true } = opts;

      const originX = MARGIN_MM * mmToPx;
      const originY = MARGIN_MM * mmToPx;

      const clamp01 = (v, min, max) => Math.max(min, Math.min(max, v));
      const gx1 = clamp ? clamp01(x1_mm, 0, GRID_W_MM) : x1_mm;
      const gy1 = clamp ? clamp01(y1_mm, 0, GRID_H_MM) : y1_mm;
      const gx2 = clamp ? clamp01(x2_mm, 0, GRID_W_MM) : x2_mm;
      const gy2 = clamp ? clamp01(y2_mm, 0, GRID_H_MM) : y2_mm;

      const x1 = originX + gx1 * mmToPx;
      const y1 = originY + gy1 * mmToPx;
      const x2 = originX + gx2 * mmToPx;
      const y2 = originY + gy2 * mmToPx;

      const left   = Math.min(x1, x2);
      const top    = Math.min(y1, y2);
      const width  = Math.abs(x2 - x1);
      const height = Math.abs(y2 - y1);

      ctx.save();
      if (behind) ctx.globalCompositeOperation = 'destination-over';
      ctx.fillStyle = color;
      ctx.fillRect(left, top, width, height);
      ctx.restore();
    }
  </script>
</body>
</html>
